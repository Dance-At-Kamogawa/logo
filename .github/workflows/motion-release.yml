name: motion-release

on:
  push:
    tags:
      - "motion-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: motion/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg (HAP encoding)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Typecheck
        run: pnpm typecheck

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render
        run: pnpm render

      - name: List outputs
        run: ls -la out/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" motion/out/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: motion-${{ github.run_number }}
          path: motion/out/
          retention-days: 14
          compression-level: 0
